services:
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: media-server
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Vienna
    volumes:
      - ./jellyfin_conf:/config
      - ./jellyfin_data:/data
    ports:
      - 8096:8096
      - 8920:8920
      - 7359:7359/udp
      - 1900:1900/udp
  mosquitto:
    image: eclipse-mosquitto
    container_name: telemetry-broker
    volumes:
      - ./telemetry_conf:/mosquitto/config
    ports:
      - 1883:1883
  influxdb:
    image: influxdb:2
    container_name: telemetry-db
    ports:
      - 8086:8086
    volumes:
      - ./influxdb_data:/var/lib/influxdb2
      - ./influxdb_conf:/etc/influxdb2
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=tuwiendsg
      - DOCKER_INFLUXDB_INIT_PASSWORD=tuwiendsg
      - DOCKER_INFLUXDB_INIT_ORG=tuwien
      - DOCKER_INFLUXDB_INIT_BUCKET=telemetry
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=december
  qos-hook:
    build:
      context: mqtt_hook
      dockerfile: Dockerfile
    environment:
      - MQTT_BROKER=mosquitto
      - MQTT_PORT=1883
      - MQTT_CLIENT_ID=media-server-api
      - MQTT_TOPIC=autowatcher/reporting
      - INFLUX_URL=http://influxdb:8086
      - INFLUX_TOKEN=december
      - INFLUX_ORG=tuwien
      - INFLUX_BUCKET=telemetry
      - CONFIG_FILE=/confs/jellyfin-qos.json
    volumes:
      -  ./hook_confs:/confs:ro
    depends_on:
      - influxdb
      - mosquitto
  nrg-hook:
    build:
      context: mqtt_hook
      dockerfile: Dockerfile
    environment:
      - MQTT_BROKER=mosquitto
      - MQTT_PORT=1883
      - INFLUX_URL=http://influxdb:8086
      - INFLUX_TOKEN=december
      - INFLUX_ORG=tuwien
      - INFLUX_BUCKET=telemetry
      - MQTT_CLIENT_ID=nrg-hook
      - MQTT_TOPIC=energy/+/SENSOR
      - CONFIG_FILE=/confs/delock-energy.json
    volumes:
      - ./hook_confs:/confs:ro
    depends_on:
      - influxdb
      - mosquitto
  cpu-freq-hook:
    build:
      context: mqtt_hook
      dockerfile: Dockerfile
    environment:
      - MQTT_BROKER=mosquitto
      - MQTT_PORT=1883
      - INFLUX_URL=http://influxdb:8086
      - INFLUX_TOKEN=december
      - INFLUX_ORG=tuwien
      - INFLUX_BUCKET=telemetry
      - MQTT_CLIENT_ID=cpu-freq-hook
      - MQTT_TOPIC=systemlemetry/CPUFreq
      - CONFIG_FILE=/confs/systemlemetry-hook-cpu-freq.json
