      - INFLUX_URL=http://influxdb:8086
      - INFLUX_TOKEN=december
      - INFLUX_ORG=tuwien
      - INFLUX_BUCKET=telemetry
      - JELLYFIN_URL=http://jellyfin:8096
      - JELLYFIN_API_KEY=f040763a24b74e99bae5f30d15215c68
      - WORKERS=1
      - LISTEN_HOST=0.0.0.0
      - LOG_LEVEL=debug
    ports:
      - 8080:80
    volumes:
      - ./slo_confs:/confs:ro
    depends_on:
