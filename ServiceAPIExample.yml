openapi: '3.1.1'
info:
  title: Service API
  version: 'research-0.1'
servers:
  - url: https://apitest:1225/v0
externalDocs:
  description: Read the paper on this specification
  url: https://doi.org/ADD-THE-DOI-HERE-ONCE-WE-HAVE-IT
tags:
  - name: slo
    description: Endpoints related to SLO measurement
    externalDocs:
      description: Read the work on how to use SLOs
      url: https://doi.org/10.1109/SOSE62363.2024.00008 # On microservice SLOs, might change
  - name: config
    description: Endpoints related to service configuration
paths:
  /slos:
    get:
      tags:
        - slo
      summary: Discover SLOs.
      description: Returns the list of declared SLOs of the service.
      operationId: slo_discover
      responses:
        '200':
          description: successful operation
          content:
            application/json: # Could be changed to XML, JSON or other types if we need to
              schema:
                type: array
                minItems: 1
                items:
                  type: string
                  minLength: 1
        '404':
          description: This service declares no SLOs
  /slos/{sloId}/description:
    get:
      tags:
        - slo
      summary: Describe SLO.
      description: Returns the description of the requested SLO.
      operationId: slo_describe
      parameters:
        - name: sloId
          in: path
          description: ID of SLO to describe
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SLO' # TODO declare SLO description schema
        '404':
          description: The requested SLO does not exist
  /slos/{sloId}: # I think this+description is enough to calculate SLO fulfillment at the DEVOL level. We can add a /fulfillment endpoint otherwise
    get:
      tags:
        - slo
      summary: SLO value.
      description: Returns the current value of the requested SLO.
      operationId: slo_value
      parameters:
        - name: sloId
          in: path
          description: ID of SLO to describe
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SLOValue' # TODO declare SLO value schema
        '404':
          description: The requested SLO does not exist
  /config:
    get:
      tags:
        - config
      summary: Discover configuration.
      description: Returns the list of configurable service parameters.
      operationId: config_discover
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: array
                minItems: 1
                items:
                  type: string
                  minLength: 1
        '404':
          description: This service declares no configurable parameters.
  /config/{confParam}/description:
    get:
      tags:
        - config
      summary: Describe configurable parameter.
      description: Returns the description of the requested parameter.
      operationId: config_describe
      parameters:
        - name: confParam
          in: path
          description: Name of the parameter to describe
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfParam' # TODO declare parameter description schema
        '404':
          description: The requested parameter does not exist
  /config/{confParam}:
    get:
      tags:
        - config
      summary: Parameter value.
      description: Returns the current value of the requested parameter.
      operationId: config_value
      parameters:
        - name: confParam
          in: path
          description: Name of the parameter to describe
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfParamValue' # TODO declare parameter value schema
        '404':
          description: The requested parameter does not exist
    put:
      tags:
        - config
      summary: Change parameter.
      description: Changes the value of the requested parameter.
      operationId: config_change
      parameters:
        - name: confParam
          in: path
          description: Name of the parameter to describe
          required: true
          schema:
            type: string
            minLength: 1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfParamValue' # TODO declare parameter value schema
      responses:
        '200':
          description: successful operation
        '404':
          description: The requested parameter does not exist
        '400':
          description: Invalid value for the parameter
components:
  schemas:
    SLO:
      type: object
      properties:
        id:
          type: string
          minLength: 1
          example: "rps"
        name:
          type: string
          minLength: 1
          example: "Requests satisfied per second"
        type:
          $ref: "#/components/schemas/SLOType"
        description:
          oneOf:
            - $ref: '#/components/schemas/BooleanSLO'
            - $ref: '#/components/schemas/RangeSLO'
            - $ref: '#/components/schemas/IntegerRangeSLO'
            - $ref: '#/components/schemas/DateRangeSLO'
            - $ref: '#/components/schemas/DateTimeRangeSLO'
            - $ref: '#/components/schemas/TargetValueSLO'
            - $ref: '#/components/schemas/IntegerTargetValueSLO'
            - $ref: '#/components/schemas/StringTargetValueSLO'
            - $ref: '#/components/schemas/DateTargetValueSLO'
            - $ref: '#/components/schemas/DateTimeTargetValueSLO'
      required:
        - id
        - type
        - description
    SLOType:
      type: string
      enum:
        - boolean
        - range
        - integer_range
        - date_range
        - datetime_range
        - target_value
        - integer_target_value
        - string_target_value
        - date_target_value
        - datetime_target_value
    BooleanSLO:
      type: boolean
    RangeSLO:
      type: object
      properties:
        minValue: # Minimum value as per the SLO
          type: number
          example: 5.1
        maxValue: # Maximum value as per the SLO
          type: number
          example: 10.5
        minRange: # Minimum absolute value the SLO can reach (for normalization)
          type: number
          example: -0.5
        maxRange: # Maximum absolute value the SLO can reach (for normalization)
          type: number
          example: 100.99
      required: # Either min or max are also required, but this cannot be expressed
        - minRange
        - maxRange
    IntegerRangeSLO:
      type: object
      properties:
        minValue: # Minimum value as per the SLO
          type: integer
          example: 5
        maxValue: # Maximum value as per the SLO
          type: integer
          example: 10
        minRange: # Minimum absolute value the SLO can reach (for normalization)
          type: integer
          example: -10
        maxRange: # Maximum absolute value the SLO can reach (for normalization)
          type: integer
          example: 100
      required: # Either min or max are also required, but this cannot be expressed
        - minRange
        - maxRange
    DateRangeSLO:
      type: object
      properties:
        minValue: # Minimum value as per the SLO
          type: string
          format: date
          example: 2003-06-12
        maxValue: # Maximum value as per the SLO
          type: string
          format: date
          example: 2010-10-03
        minRange: # Minimum absolute value the SLO can reach (for normalization)
          type: string
          format: date
          example: 1970-01-01
        maxRange: # Maximum absolute value the SLO can reach (for normalization)
          type: string
          format: date
          example: 5012-07-04
      required: # Either min or max are also required, but this cannot be expressed
        - minRange
        - maxRange
    DateTimeRangeSLO:
      type: object
      properties:
        minValue: # Minimum value as per the SLO
          type: string
          format: date-time
          example: 2003-06-12T12:00:00Z
        maxValue: # Maximum value as per the SLO
          type: string
          format: date
          example: 2010-10-03T10:15:00Z
        minRange: # Minimum absolute value the SLO can reach (for normalization)
          type: string
          format: date
          example: 1970-01-01T00:00:00Z
        maxRange: # Maximum absolute value the SLO can reach (for normalization)
          type: string
          format: date
          example: 5012-07-04T05:12:23Z
      required: # Either min or max are also required, but this cannot be expressed
        - minRange
        - maxRange
    TargetValueSLO:
      type: number
    IntegerTargetValueSLO:
      type: integer
    StringTargetValueSLO:
      type: string
    DateTargetValueSLO:
      type: string
      format: date
    DateTimeTargetValueSLO:
      type: string
      format: date-time
    SLOValue:
      oneOf:
        - type: boolean
        - type: number
        - type: integer
        - type: string
        - type: string
          format: date
        - type: string
          format: date-time
    ConfParam:
      type: object
      properties:
        id:
          type: string
          minLength: 1
          example: res
        name:
          type: string
          example: Resolution
          minLength: 1
        type:
          $ref: "#/components/schemas/ConfParamType"
        description:
          oneOf:
            - $ref: '#/components/schemas/BooleanConfParam'
            - $ref: '#/components/schemas/ByteConfParam'
            - $ref: '#/components/schemas/BinaryConfParam'
            - $ref: '#/components/schemas/RangeConfParam'
            - $ref: '#/components/schemas/IntegerRangeConfParam'
            - $ref: '#/components/schemas/DateRangeConfParam'
            - $ref: '#/components/schemas/DateTimeRangeConfParam'
            - $ref: '#/components/schemas/NumericValueListConfParam'
            - $ref: '#/components/schemas/IntegerValueListConfParam'
            - $ref: '#/components/schemas/StringValueListConfParam'
            - $ref: '#/components/schemas/DateValueListConfParam'
            - $ref: '#/components/schemas/DateTimeValueListConfParam'
            - $ref: '#/components/schemas/ByteValueListConfParam'
            - $ref: '#/components/schemas/BinaryValueListConfParam'
      required:
        - id
        - type
        - description
    ConfParamType:
      type: string
      enum:
        - boolean
        - byte
        - binary
        - range
        - integer_range
        - date_range
        - datetime_range
        - numeric_value_list
        - integer_value_list
        - string_value_list
        - date_value_list
        - datetime_value_list
        - byte_value_list
        - binary_value_list
    BooleanConfParam:
      type: boolean
    ByteConfParam:
      type: string
      format: byte
      example: "SS4gSGVhci4gQS4gU291bmQu=="
    BinaryConfParam:
      type: string
      format: binary
    RangeConfParam:
      type: object
      properties:
        minValue:
          type: number
          example: -10.5
        maxValue:
          type: number
          example: 20.1
        # No required properties. To specify a continuous numerical parameter, just leave it unbounded.
    IntegerRangeConfParam:
      type: object
      properties:
        minValue:
          type: integer
          example: -512
        maxValue:
          type: number
          example: 23
        # No required properties. To specify an integer parameter, just leave it unbounded.
    DateRangeConfParam:
      type: object
      properties:
        minValue:
          type: string
          format: date
          example: 2003-06-12
        maxValue:
          type: string
          format: date
          example: 2010-10-03
          # No required properties. To specify a date parameter, just leave it unbounded.
    DateTimeRangeConfParam:
      type: object
      properties:
        minValue: # Minimum value as per the SLO
          type: string
          format: date-time
          example: 2003-06-12T12:00:00Z
        maxValue: # Maximum value as per the SLO
          type: string
          format: date
          example: 2010-10-03T10:15:00Z
          # No required properties. To specify an integer parameter, just leave it unbounded.
    NumericValueListConfParam:
      type: array
      minItems: 1
      items:
        type: number
    IntegerValueListConfParam:
      type: array
      minItems: 1
      items:
        type: integer
    StringValueListConfParam:
      type: array
      minItems: 1
      items:
        type: string
    DateValueListConfParam:
      type: array
      minItems: 1
      items:
        type: string
        format: date
    DateTimeValueListConfParam:
      type: array
      minItems: 1
      items:
        type: string
        format: date-time
    ByteValueListConfParam:
      type: array
      minItems: 1
      items:
        type: string
        format: byte
    BinaryValueListConfParam:
      type: array
      minItems: 1
      items:
        type: string
        format: binary
    ConfParamValue:
      oneOf:
        - type: boolean
        - type: number
        - type: integer
        - type: string
        - type: string
          format: date
        - type: string
          format: date-time
        - type: string
          format: byte
        - type: string
          format: binary