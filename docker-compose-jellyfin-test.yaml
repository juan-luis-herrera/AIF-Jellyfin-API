services:
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Vienna
    volumes:
      - ./jellyfin_conf:/config
      - ./jellyfin_data:/data
    ports:
      - 8096:8096
      - 8920:8920
      - 7359:7359/udp
      - 1900:1900/udp
  telemetry:
    image: eclipse-mosquitto
    container_name: telemetry
    volumes:
      - ./telemetry_conf:/mosquitto/config
    ports:
      - 1883:1883